<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Catálogo de Tiendas de Ropa</title>
    <meta name="description" content="Ponte en contacto con nosotros para consultas sobre tiendas de ropa, catálogos y marcas disponibles.">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <h1>Contacto</h1>

    <h2>Formulario de Consulta</h2>

    <form action="#" method="post">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"><br><br>

        <label for="email">Correo electrónico:</label><br>
        <input type="email" id="email" name="email" placeholder="tu@email.com"><br><br>

        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="4" cols="30" placeholder="Escribe tu mensaje aquí"></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>

    <br><br>

    <a href="index.html">Volver al inicio</a>

</body>

</html>
